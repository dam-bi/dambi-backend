spring:
  application:
    name: ticketing
  profiles:
    default: local

jwt:

  access-secret: ${JWT_ACCESS_SECRET} # base64
  refresh-secret: ${JWT_REFRESH_SECRET} # base64
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS} #access token 만료기간
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS} #refresh token 만료기간

---
# local: local DB enabled runtime
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:password}
    driver-class-name: ${LOCAL_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

---

# dev: shared development DB runtime
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: ${DEV_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
# prod: production DB runtime
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: ${PROD_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
