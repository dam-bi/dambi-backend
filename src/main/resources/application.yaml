spring:
  application:
    name: ticketing
  profiles:
    default: local


---
# local: 개발자 로컬 환경에서 DB를 연결해 실행하는 모드
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:password}
    driver-class-name: ${LOCAL_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

---

# testWithoutDB: DB 연결 없이 화면/컨트롤러/비DB 테스트를 실행하는 모드
spring:
  config:
    activate:
      on-profile: testWithoutDB
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
---
# test: DB 테이블 자동생성 허용하여 화면/컨트롤러/비DB 테스트를 실행하는 모드
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration


---
# dev: 개발 서버 환경에서 개발용 DB를 연결해 실행하는 모드
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: ${DEV_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
# prod: 운영 서버 환경에서 운영 DB를 연결해 실행하는 모드
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: ${PROD_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
